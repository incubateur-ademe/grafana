apiVersion: 1
prune: true

datasources:
  - version: 1
    uuid: "scalingo-json-api"
    name: "scalingo-json-api"
    type: "yesoreyeram-infinity-datasource"
    url: "https://fgp.incubateur.ademe.fr/v1"
    basicAuth: false
    isDefault: true
    jsonData:
      allowedHosts:
        - "https://fgp.incubateur.ademe.fr"
      auth_method: "none"
      customHealthCheckEnabled: false
      httpHeaderName1: "Content-Type"
      httpHeaderName2: "Accept"
      httpHeaderName3: "X-FGP-Key"
      httpHeaderName4: "X-FGP-Blob"
    secureJsonData:
      httpHeaderValue1: "application/json"
      httpHeaderValue2: "application/json"
      httpHeaderValue3: $FGP_KEY_FR1
      httpHeaderValue4: $FGP_BLOB_FR1
